<c-vars title progress="" show_title="True" />
<section class="folio-practice" {{ attrs }}>{% if progress %}<div class="folio-practice-progress" role="progressbar" aria-label="Progress" aria-valuenow="{{ progress }}" aria-valuemin="0" aria-valuemax="100"><span style="width:{{ progress }}%"></span></div>{% endif %}{% if show_title %}<h2>{{ title }}</h2>{% endif %}<div class="folio-practice-content">{{ slot }}</div><footer class="folio-practice-footer">{{ actions }}</footer></section>
