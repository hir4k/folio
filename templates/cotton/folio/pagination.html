<c-vars page query="" label="Pagination" />
{% if page.has_other_pages %}
<nav class="folio-pagination d-flex align-items-center justify-content-between gap-3 flex-wrap mt-4" aria-label="{{ label }}">
    <span class="small text-secondary">Page <strong>{{ page.number }}</strong> of {{ page.paginator.num_pages }}</span>
    <ul class="pagination mb-0 gap-2">
        <li class="page-item {% if not page.has_previous %}disabled{% endif %}">
            {% if page.has_previous %}<a class="page-link" href="?q={{ query|urlencode }}&amp;page={{ page.previous_page_number }}">Previous</a>{% else %}<span class="page-link">Previous</span>{% endif %}
        </li>
        <li class="page-item {% if not page.has_next %}disabled{% endif %}">
            {% if page.has_next %}<a class="page-link" href="?q={{ query|urlencode }}&amp;page={{ page.next_page_number }}">Next</a>{% else %}<span class="page-link">Next</span>{% endif %}
        </li>
    </ul>
</nav>
{% endif %}
