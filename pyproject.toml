[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-folio-components"
version = "0.1.0"
description = "Book-inspired Bootstrap and Django Cotton components"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Django>=5.2", "django-cotton>=2"]
license = "MIT"

[tool.setuptools]
packages = ["folio"]
package-dir = {folio = "."}

[tool.setuptools.package-data]
folio = ["templates/**/*.html", "static/folio/*.css", "static/folio/*.js", "static/folio/icons/*.svg", "static/folio/*LICENSE", "static/folio/*.md"]
